[project]
name = "studymind-ai-backend"
version = "0.1.0"
description = "StudyMind AI - Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.3",
    "asyncpg>=0.31.0",
    "bcrypt<4.0.0",
    "fastapi>=0.128.0",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.11.0",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]>=0.40.0",
    "transformers>=4.47.1",
    "torch>=2.6.0",
    "pydantic-settings>=2.13.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.1",
    "tenacity>=8.2.3",
    "email-validator>=2.1.0",
    "passlib[bcrypt]>=1.7.4",
]

[dependency-groups]
dev = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
